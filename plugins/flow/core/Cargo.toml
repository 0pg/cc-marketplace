[package]
name = "flow-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for flow plugin - DAG schema validation and graph operations"
authors = ["jhk"]

[[bin]]
name = "flow-core"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.9"
