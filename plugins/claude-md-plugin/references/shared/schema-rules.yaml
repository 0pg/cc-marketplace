# CLAUDE.md Schema Rules - Single Source of Truth
# This file defines all validation rules for CLAUDE.md files.
# Rules are consumed by:
#   - Rust core engine (build-time code generation via build.rs)
#   - Documentation (templates/claude-md-schema.md)
#   - Schema-validate skill (claude-md-core validate-schema CLI)

version: "3.0.0"
description: "CLAUDE.md 스키마 검증 규칙 - v3 (Code-First + Pre-learning Index)"

sections:
  purpose:
    name: "Purpose"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: false
    description: "모듈의 책임을 1-2문장으로 명시"

  constraints:
    name: "Constraints"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: true
    description: "코드가 지켜야 할 규칙. 자기완결(상위 제약 포함 반복)."

  domain_context:
    name: "Domain Context"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: true
    description: "핵심 맥락 요약. 2-3문장."

  instructions:
    name: "Instructions"
    required: false
    condition: "is_project_root"
    condition_type: "dynamic"
    allow_none: false
    description: "AI 행동 지시. project root에만."

  project_convention:
    name: "Project Convention"
    required: false
    condition: "is_project_or_module_root"
    condition_type: "dynamic"
    allow_none: false
    description: "프로젝트 수준 아키텍처/구조 규칙"
    required_subsections:
      - "Project Structure"
      - "Module Boundaries"
      - "Naming Conventions"

  code_convention:
    name: "Code Convention"
    required: false
    condition: "is_project_or_module_root"
    condition_type: "dynamic"
    allow_none: false
    description: "소스코드 수준 코딩 규칙"
    required_subsections:
      - "Language & Runtime"
      - "Coding Rules"
      - "Naming Rules"

convention_rules:
  module_root_markers:
    - "package.json"
    - "Cargo.toml"
    - "go.mod"
    - "pyproject.toml"
    - "build.gradle"
    - "build.gradle.kts"
    - "pom.xml"
    - "setup.py"
    - "CMakeLists.txt"

reference_rules:
  forbidden_patterns:
    - pattern: "\\.\\./"
      description: "부모 디렉토리 참조 금지"
    - pattern: "\\.\\.\\\\/"
      description: "부모 디렉토리 참조 금지 (Windows)"

  allowed_patterns:
    - pattern: "^\\.\\/|^\\.\\\\/"
      description: "자식 디렉토리 참조 허용"

developers_sections:
  file_map:
    name: "File Map"
    required: true
    allow_none: false
    condition: "has_multiple_files"
    description: "파일별 역할 및 의존관계 테이블"
  data_structures:
    name: "Data Structures"
    required: true
    allow_none: true
    description: "내부 자료구조 관계 및 변환 흐름"
  decision_log:
    name: "Decision Log"
    required: true
    allow_none: true
    description: "ADR 스타일 결정 기록. 각 결정을 소제목으로, Context/Decision/Rationale 또는 맥락/결정/근거 고정 스키마"
    required_entry_fields:
      - "Context|맥락"
      - "Decision|결정"
      - "Rationale|근거"
  operations:
    name: "Operations"
    required: true
    allow_none: true
    description: "배포, 모니터링, 트러블슈팅"
    subsections:
      - "Gotchas"
      - "Deployment|배포"
      - "Monitoring|모니터링"

none_marker:
  values:
    - "None"
    - "none"
    - "N/A"
    - "n/a"
  description: "명시적으로 해당 섹션이 비어있음을 표시하는 값"
