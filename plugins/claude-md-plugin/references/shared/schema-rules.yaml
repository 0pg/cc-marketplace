# CLAUDE.md Schema Rules - Single Source of Truth
# This file defines all validation rules for CLAUDE.md files.
# Rules are consumed by:
#   - Rust core engine (build-time code generation via build.rs)
#   - Documentation (templates/claude-md-schema.md)
#   - Schema-validate skill (claude-md-core validate-schema CLI)

version: "3.1.0"
description: "CLAUDE.md 스키마 검증 규칙 - v3.1 (Pre-learning Index + Human Knowledge Store)"

sections:
  purpose:
    name: "Purpose"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: false
    description: "모듈의 책임을 1-2문장으로 명시"

  constraints:
    name: "Constraints"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: true
    description: "코드가 지켜야 할 규칙. 자기완결(상위 제약 포함 반복)."

  domain_context:
    name: "Domain Context"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: true
    description: "핵심 맥락 요약. 2-3문장."

  instructions:
    name: "Instructions"
    required: false
    condition: "is_project_root"
    condition_type: "dynamic"
    allow_none: false
    description: "AI 행동 지시. project root에만."

  conventions:
    name: "Conventions"
    required: false
    condition: "is_project_or_module_root"
    condition_type: "dynamic"
    allow_none: false
    description: "프로젝트/코드 수준 통합 규칙"
    required_subsections:
      - "Project Structure"
      - "Module Boundaries"
      - "Naming Conventions"
      - "Language & Runtime"
      - "Coding Rules"
      - "Naming Rules"

convention_rules:
  module_root_markers:
    - "package.json"
    - "Cargo.toml"
    - "go.mod"
    - "pyproject.toml"
    - "build.gradle"
    - "build.gradle.kts"
    - "pom.xml"
    - "setup.py"
    - "CMakeLists.txt"

reference_rules:
  forbidden_patterns:
    - pattern: "\\.\\./"
      description: "부모 디렉토리 참조 금지"
    - pattern: "\\.\\.\\\\/"
      description: "부모 디렉토리 참조 금지 (Windows)"

  allowed_patterns:
    - pattern: "^\\.\\/|^\\.\\\\/"
      description: "자식 디렉토리 참조 허용"

developers_sections:
  domain_context:
    name: "Domain Context"
    required: true
    allow_none: true
    description: "모듈 도메인 맥락 상세. CLAUDE.md Domain Context의 확장."
  invariants:
    name: "Invariants"
    required: true
    allow_none: true
    description: "모듈 내부 불변식. 코드가 항상 만족해야 할 조건."
  decision_log:
    name: "Decision Log"
    required: true
    allow_none: true
    description: "ADR 스타일 결정 기록. 각 결정을 소제목으로, Context/Decision/Rationale 또는 맥락/결정/근거 고정 스키마"
    required_entry_fields:
      - "Context|맥락"
      - "Decision|결정"
      - "Rationale|근거"
  operations:
    name: "Operations"
    required: true
    allow_none: true
    description: "배포, 모니터링, 트러블슈팅"
    subsections:
      - "Gotchas"
      - "Deployment|배포"
      - "Monitoring|모니터링"
  file_map:
    name: "File Map"
    required: true
    allow_none: true
    description: "파일별 역할 및 의존관계 테이블"

none_marker:
  values:
    - "None"
    - "none"
    - "N/A"
    - "n/a"
  description: "명시적으로 해당 섹션이 비어있음을 표시하는 값"
