# CLAUDE.md Schema Rules - Single Source of Truth
# This file defines all validation rules for CLAUDE.md files.
# Rules are consumed by:
#   - Rust core engine (build-time code generation via build.rs)
#   - Documentation (references/shared/claude-md-schema.md)
#   - Schema-validate skill (claude-md-core validate-schema CLI)

version: "5.0.0"
description: "CLAUDE.md 스키마 검증 규칙 - v4.0 (Primary SSOT — PM 요구사항)"

sections:
  purpose:
    name: "Purpose"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: false
    description: "모듈의 존재 이유 (비즈니스 가치)"

  requirements:
    name: "Requirements"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: true
    description: "비즈니스 요구사항 (사용자 관점, 검증 가능한 문장)"

  domain_context:
    name: "Domain Context"
    required: true
    condition: "always"
    condition_type: "static"
    allow_none: true
    description: "비즈니스 제약 배경 (규정, 레거시, 조직적 이유)"

  instructions:
    name: "Instructions"
    required: false
    condition: "is_project_root"
    condition_type: "dynamic"
    allow_none: false
    description: "AI 행동 지시. project root에만."

  conventions:
    name: "Conventions"
    required: false
    condition: "is_project_or_module_root"
    condition_type: "dynamic"
    allow_none: false
    description: "프로젝트/코드 수준 통합 규칙"
    required_subsections:
      - "Project Structure"
      - "Module Boundaries"
      - "Naming Conventions"
      - "Language & Runtime"
      - "Coding Rules"
      - "Naming Rules"

convention_rules:
  module_root_markers:
    - "package.json"
    - "Cargo.toml"
    - "go.mod"
    - "pyproject.toml"
    - "build.gradle"
    - "build.gradle.kts"
    - "pom.xml"
    - "setup.py"
    - "CMakeLists.txt"

reference_rules:
  forbidden_patterns:
    - pattern: "\\.\\./"
      description: "부모 디렉토리 참조 금지"
    - pattern: "\\.\\.\\\\/"
      description: "부모 디렉토리 참조 금지 (Windows)"

  allowed_patterns:
    - pattern: "^\\.\\/|^\\.\\\\/"
      description: "자식 디렉토리 참조 허용"

developers_sections:
  constraints:
    name: "Constraints"
    required: true
    allow_none: true
    description: "정밀한 입출력 계약 — 테스트 변환 가능해야 함"
  data_schemas:
    name: "Data Schemas"
    required: false
    allow_none: true
    description: "모듈의 공개 타입 정의 (다른 모듈이 참조하는 타입들)"
  technical_context:
    name: "Technical Context"
    required: true
    allow_none: true
    description: "기술 선택 + 근거 (라이브러리, 알고리즘, 패턴)"
  decision_log:
    name: "Decision Log"
    required: false
    allow_none: true
    description: "ADR 스타일 결정 기록. 각 결정을 소제목으로, Context/Decision/Rationale 또는 맥락/결정/근거 고정 스키마"
    required_entry_fields:
      - "Context|맥락"
      - "Decision|결정"
      - "Rationale|근거"
  flows:
    name: "Flows"
    required: false
    condition: "is_project_root"
    condition_type: "dynamic"
    allow_none: true
    description: "시스템 수준 use case 실행 흐름 (project root only)"
  agent_observations:
    name: "Agent Observations"
    required: false
    allow_none: true
    agent_managed: true
    description: "Agent가 작업 중 발견한 경험지식. agent-writable 전용 섹션."
    valid_entry_types:
      - "structural"
      - "decision"
      - "tactical"
      - "preference"
    required_entry_fields:
      - "since"
      - "refs"
      - "source"

migrations:
  renames:
    - from: "Constraints"
      to: "Requirements"
      document: "claude_md"
    - from: "Domain Context"
      to: "Technical Context"
      document: "developers_md"
    - from: "Invariants"
      to: "Constraints"
      document: "developers_md"
  removals:
    - name: "File Map"
      document: "developers_md"
    - name: "Operations"
      document: "developers_md"
    - name: "Public API"
      document: "developers_md"

none_marker:
  values:
    - "None"
    - "none"
    - "N/A"
    - "n/a"
  description: "명시적으로 해당 섹션이 비어있음을 표시하는 값"
